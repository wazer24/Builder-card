<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 — Frame & ID Card Generator</title>
    <meta name="description" content="Upload your photo and instantly get a branded HH Goa 2026 PFP frame or Builder ID card. Download and share on X with #FrameInGoa.">

    <!-- Open Graph -->
    <meta property="og:title" content="HH Goa 2026 — Get Your Builder Frame">
    <meta property="og:description" content="Upload your photo, get a branded HH Goa 2026 frame or builder ID card. Ready to share on X.">
    <meta property="og:image" content="/og/og-default.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="HH Goa 2026 — Get Your Builder Frame">
    <meta name="twitter:description" content="Upload • Generate • Share. Get your HH Goa 2026 builder frame!">
    <meta name="twitter:image" content="/og/og-default.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main class="app">
        <!-- Header -->
        <header class="header">
            <div class="header__logo">
                <img src="/assets/logo.png" alt="HH Goa Logo" width="48" height="48" class="header__icon">
                <div>
                    <h1 class="header__title">HH GOA 2026</h1>
                    <p class="header__subtitle">Frame & ID Card Generator</p>
                </div>
            </div>
        </header>

        <!-- Tab Switcher -->
        <nav class="tabs" role="tablist" aria-label="Generator format">
            <button 
                id="tab-frame" 
                class="tab tab--active" 
                role="tab" 
                aria-selected="true" 
                aria-controls="panel-frame"
                data-tab="frame"
            >
                <span class="tab__icon">🖼️</span>
                <span class="tab__label">PFP Frame</span>
            </button>
            <button 
                id="tab-card" 
                class="tab" 
                role="tab" 
                aria-selected="false" 
                aria-controls="panel-card"
                data-tab="card"
            >
                <span class="tab__icon">🪪</span>
                <span class="tab__label">Builder ID</span>
            </button>
        </nav>

        <!-- Format A: PFP Frame Panel -->
        <section id="panel-frame" class="panel panel--active" role="tabpanel" aria-labelledby="tab-frame">
            <div class="upload-zone" id="upload-zone-frame">
                <input 
                    type="file" 
                    id="file-input-frame" 
                    class="upload-zone__input" 
                    accept="image/jpeg,image/png,image/heic,image/heif,image/webp"
                >
                <div class="upload-zone__content">
                    <div class="upload-zone__icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-zone__text">Upload your photo</p>
                    <p class="upload-zone__hint">JPG, PNG, HEIC • Tap to select</p>
                </div>
                <div class="upload-zone__loading hidden" id="loading-frame">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>
            </div>
        </section>

        <!-- Format B: Builder ID Card Panel -->
        <section id="panel-card" class="panel" role="tabpanel" aria-labelledby="tab-card" hidden>
            <div class="upload-zone" id="upload-zone-card">
                <input 
                    type="file" 
                    id="file-input-card" 
                    class="upload-zone__input" 
                    accept="image/jpeg,image/png,image/heic,image/heif,image/webp"
                >
                <div class="upload-zone__content" id="upload-content-card">
                    <div class="upload-zone__icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="upload-zone__text">Upload your photo</p>
                    <p class="upload-zone__hint">JPG, PNG, HEIC • Tap to select</p>
                </div>
                <div class="upload-zone__loading hidden" id="loading-card">
                    <div class="spinner"></div>
                    <p>Processing...</p>
                </div>
                <!-- Thumbnail preview after upload -->
                <div class="upload-zone__preview hidden" id="upload-preview-card">
                    <img id="upload-thumb-card" alt="Uploaded photo thumbnail">
                    <button class="upload-zone__change" id="change-photo-card">Change photo</button>
                </div>
            </div>

            <!-- Card fields (shown after photo upload) -->
            <div class="card-fields hidden" id="card-fields">
                <div class="field">
                    <label for="field-name" class="field__label">Your Name</label>
                    <input type="text" id="field-name" class="field__input" placeholder="e.g. Arjun Mehta" maxlength="30" autocomplete="name">
                </div>
                <div class="field">
                    <label for="field-stack" class="field__label">Stack / Role</label>
                    <input type="text" id="field-stack" class="field__input" placeholder="e.g. Full-Stack • React + Node" maxlength="40">
                </div>
                <button id="btn-generate-card" class="btn btn--primary btn--generate">
                    <span class="btn__sparkle">✨</span>
                    Generate Builder ID
                </button>
            </div>
        </section>

        <!-- Result Section (shared) -->
        <section class="result hidden" id="result-section">
            <h2 class="result__heading">Your HH Goa 2026 Frame</h2>
            <div class="result__canvas-wrap" id="result-canvas-wrap">
                <!-- Canvas gets appended here by JS -->
            </div>
            <div class="result__actions">
                <button id="btn-download" class="btn btn--primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
                <button id="btn-share" class="btn btn--accent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                        <polyline points="16 6 12 2 8 6"/>
                        <line x1="12" y1="2" x2="12" y2="15"/>
                    </svg>
                    Share on 𝕏
                </button>
            </div>
            <p class="result__hint" id="share-hint" hidden>
                📎 Image downloaded! Attach it to your tweet.
            </p>
            <button class="btn btn--ghost" id="btn-new">
                ← Create another
            </button>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Made for HH Goa 2026 🌴 • #FrameInGoa</p>
        </footer>
    </main>

    <!-- Toast notification -->
    <div class="toast hidden" id="toast" role="alert" aria-live="polite">
        <p id="toast-message"></p>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
